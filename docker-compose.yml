version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aim_postgres
    environment:
      POSTGRES_DB: aim_db
      POSTGRES_USER: aim_user
      POSTGRES_PASSWORD: aim_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim_user -d aim_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aim_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aim_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: aim_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/aim-content;
      mc anonymous set download local/aim-content;
      echo 'MinIO bucket ready';
      "
    restart: on-failure

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: aim_ml_service
    ports:
      - "8100:8100"
    environment:
      AIM_ML_REDIS_URL: redis://redis:6379/2
      AIM_ML_DJANGO_BACKEND_URL: http://host.docker.internal:8000/api
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ml_model_cache:/root/.cache

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ml_model_cache:
